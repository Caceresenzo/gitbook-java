name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Run tests
        run: mvn -B test
        env:
          GITBOOK_ACCESS_TOKEN: ${{ secrets.GITBOOK_ACCESS_TOKEN }}
          GITBOOK_COMPONENTS_SPACE_ID: ${{ secrets.GITBOOK_COMPONENTS_SPACE_ID }}
          GITBOOK_COMPONENTS_ORGANIZATION_ID: ${{ secrets.GITBOOK_COMPONENTS_ORGANIZATION_ID }}
